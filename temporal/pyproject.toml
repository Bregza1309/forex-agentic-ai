[project]
name = "forex-agentic-ai-temporal"
version = "0.1.0"
description = "Temporal worker for Forex Agentic AI — data ingestion, analysis, and Claude Bedrock orchestration"
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.5.0",
  "pydantic==2.7.3",
  "pydantic-settings==2.4.0",
  "boto3>=1.35.0",
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "ta>=0.11.0",
  "httpx>=0.27.0",
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-json-report"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
